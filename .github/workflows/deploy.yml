# main 브랜치에 올리면 자동으로 검사 → 빌드 → GitHub Pages에 반영한다.
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 한 번 설정해야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # 배포 중간에 끊지 않는다 (GitHub 권장)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 앱은 app/, 공통 코드는 공통/ 에 나란히 내려받는다 (앱의 vite.config.js가 ../공통 을 찾는다)
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        with:
          repository: lakesis1207-afk/elephant-common
          path: 공통
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
